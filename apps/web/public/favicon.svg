<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景渐变色：从蓝绿到深蓝 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <!-- 内部图标渐变，增加微弱立体感 -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F4F8" />
    </linearGradient>
    <!-- 投影效果 -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- 背景：圆角矩形 -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- 主体图标：结合对话框与飞行质感的几何形 -->
  <g transform="translate(116, 116)" fill="url(#iconGrad)">
    <!-- 气泡主体 -->
    <path d="M 140 20 
             C 217 20, 260 63, 260 140 
             C 260 217, 217 260, 140 260 
             C 120 260, 95 255, 75 245 
             L 20 260 
             L 35 205 
             C 23 185, 20 160, 20 140 
             C 20 63, 63 20, 140 20 Z" />
    
    <!-- 内部镂空/负空间：象征传递的纸飞机/箭头造型 (深蓝色，透出背景) -->
    <path d="M 95 135 
             L 180 90 
             L 145 180 
             L 130 145 
             Z" fill="#1d86e6" opacity="0.85" />
  </g>
</svg>